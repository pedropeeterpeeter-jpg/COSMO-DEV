<div class="container mt-4">

```
<div class="header text-center">
    <h1>Sistema  de Previsões de Abandono Escolar</h1>
    <p>Machine Learning + Explainable Artificial Intelligence (XAI)</p>
</div>

<div class="row">

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h3>345</h3>
            <p>Total de Registos</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h3>Random Forest</h3>
            <p>Modelo Utilizado</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h3>23</h3>
            <p>Variáveis Analisadas</p>
        </div>
    </div>

</div>




<h3 class="section-title">
    Preencha os campos para Simulação e análise do Estudante
</h3>

<div class="card p-4">

  
<form action="/predict" method="POST">

<div class="row">


  <div class="col-md-4">
    <label>Nome do Estudante</label>
<select class="form-control" name="Nome do Estudante">
            <option>Pedro Afonso</option>
            <option>Pedro João Afonso</option>
            <option>Tonícia</option>
            <option>Julho Tungo</option>
        </select>
</div>

    <div class="col-md-4 mb-3">
        <label>Idade</label>
        <input type="number" class="form-control" name="idade" required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Sexo</label>
        <select class="form-control" name="sexo">
            <option>Masculino</option>
            <option>Feminino</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Província</label>
        <input type="text" class="form-control" name="provincia" required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Município</label>
        <input type="text" class="form-control" name="municipio" required>
    </div>

    <div class="col-md-4 mb-3">
        <label>Zona</label>
        <select class="form-control" name="zona">
            <option>Urbana</option>
            <option>Rural</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Tipo de Instituição</label>
        <select class="form-control" name="tipo_instituicao">
            <option>Pública</option>
            <option>Privada</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Nível de Ensino</label>
        <input type="text" class="form-control" name="nivel_ensino">
    </div>

    <div class="col-md-4 mb-3">
        <label>Classe</label>
        <input type="text" class="form-control" name="classe">
    </div>

    <div class="col-md-4 mb-3">
        <label>Renda Familiar</label>
        <select class="form-control" name="renda_familiar">
            <option>Baixa</option>
            <option>Média</option>
            <option>Alta</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Número de Irmãos</label>
        <input type="number" class="form-control" name="numero_irmaos">
    </div>

    <div class="col-md-4 mb-3">
        <label>Distância da Escola (km)</label>
        <input type="number" step="0.1" class="form-control" name="distancia">
    </div>

    <div class="col-md-4 mb-3">
        <label>Meio de Transporte</label>
        <input type="text" class="form-control" name="transporte">
    </div>

    <div class="col-md-4 mb-3">
        <label>Trabalha</label>
        <select class="form-control" name="trabalha">
            <option>Sim</option>
            <option>Não</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Repetiu Ano</label>
        <select class="form-control" name="repetiu">
            <option>Sim</option>
            <option>Não</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Número de Reprovações</label>
        <input type="number" class="form-control" name="reprovacoes">
    </div>

    <div class="col-md-4 mb-3">
        <label>Apoio Familiar</label>
        <select class="form-control" name="apoio">
            <option>Baixo</option>
            <option>Médio</option>
            <option>Alto</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Buling</label>
        <select class="form-control" name="bullying">
            <option>Sim</option>
            <option>Não</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Acesso à Internet</label>
        <select class="form-control" name="internet">
            <option>Sim</option>
            <option>Não</option>
        </select>
    </div>

    <div class="col-md-4 mb-3">
        <label>Pretende Retornar</label>
        <select class="form-control" name="retornar">
            <option>Sim</option>
            <option>Não</option>
        </select>
    </div>

</div>

<button class="btn btn-primary btn-lg">
    Realizar Previsão
</button>

</form>

</div>
